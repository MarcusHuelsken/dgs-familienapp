<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denkaufgaben und Dino-Mission</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#202d39;font:17px/1.5 system-ui,sans-serif}body.dino{background:#e4f4e8;color:#183b34}main{max-width:680px;margin:auto;padding:24px 16px}header,nav,.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}header{justify-content:space-between;margin-bottom:15px}article{background:white;border:1px solid #cdd8d5;border-radius:24px;padding:clamp(18px,5vw,40px);box-shadow:0 12px 30px #20323212}h1{font-size:clamp(27px,6vw,40px);line-height:1.12;margin:12px 0}p{margin:12px 0}button,textarea,select{font:inherit}button{cursor:pointer;min-height:48px;border:1px solid #9caeac;border-radius:12px;background:#fff;color:inherit;padding:9px 15px;font-weight:600}button.primary,button[aria-pressed=true]{background:#274450;color:white;border-color:transparent}.dino button.primary,.dino button[aria-pressed=true]{background:#216451}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8d5100;outline-offset:3px}.choices{margin:18px 0}.choices button{min-width:64px}.symbols{font-size:32px;letter-spacing:.25em}.grid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin:16px 0}.grid button{height:56px;padding:0;font-size:25px}.grid .start{box-shadow:inset 0 0 0 2px #829e96}nav{margin-top:26px}nav .primary{margin-left:auto}progress{width:100%;accent-color:#286650;height:12px}.pet{font-size:64px;line-height:1;float:right;margin:0 0 10px 12px}small{display:block;color:#47595c}label{display:block;margin:10px 0}textarea{width:100%;min-height:85px;border:1px solid #9caeac;border-radius:8px;padding:8px}fieldset{margin:16px 0;border:1px solid #cdd8d5;border-radius:12px;padding:14px}select{max-width:100%;padding:6px}.report{min-height:160px;margin-top:12px}button:disabled{opacity:.5;cursor:default}
 .picture-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:16px 0}
.picture{display:inline-grid;place-items:center;position:relative;min-width:clamp(38px,10vw,60px);height:clamp(44px,11vw,64px);border-radius:12px;background:#eaf6ed;font-size:clamp(23px,7vw,38px)}
.picture.gone{opacity:.55}.picture.gone::after{content:'';position:absolute;width:85%;height:3px;background:#7c2c3a;transform:rotate(-45deg)}
.picture-choices button{font-size:clamp(26px,8vw,42px);min-width:62px}
.picture-strip .arrow{background:transparent;min-width:24px}
.memory-picked{min-height:56px}.dino .grid button{font-size:31px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin:22px 0}
.tile{text-align:left;min-height:116px;background:#f0f7f3;border-color:#9ab8ab}
.tile span{display:block;font-size:23px}.tile small{font-weight:400;margin-top:3px}
.word{font-size:clamp(28px,8vw,53px);overflow-wrap:anywhere;text-align:center;margin:24px 0}
.result{padding:12px 15px;background:#f0f7f3;border-radius:12px;margin:14px 0}
.form-error{color:#8a2435}.word-list{overflow-wrap:anywhere}
 .answer-input{font:inherit;width:100%;padding:10px;border:1px solid #9caeac;border-radius:8px}.letters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.letters button{min-width:48px;font-size:22px}.cloze{font-size:clamp(21px,5vw,32px);overflow-wrap:anywhere}


.tiles .tile:nth-child(5n+1){background:#e0f4e8;border-color:#7fb49b}
.tiles .tile:nth-child(5n+2){background:#fff1ce;border-color:#d4ac61}
.tiles .tile:nth-child(5n+3){background:#e8e7fc;border-color:#a9a0d9}
.tiles .tile:nth-child(5n+4){background:#fce7ed;border-color:#d8a2b4}
.tiles .tile:nth-child(5n+5){background:#e1f1fc;border-color:#8bb4cd}
.puzzle-board,.piece-tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:360px;margin:12px auto}
.puzzle-board:has(.photo),.piece-tray:has(.photo){aspect-ratio:var(--photo-ratio,3/4)}
.piece-tray:has(.photo){aspect-ratio:auto;grid-auto-rows:minmax(54px,auto)}
.puzzle-board button,.piece-tray button{min-width:0;padding:0;min-height:0;aspect-ratio:1;border:1px solid #9aaea7;border-radius:7px;font-size:clamp(12px,4vw,22px)}
.puzzle-board:has(.photo) button,.puzzle-board.photo-board button,.piece-tray:has(.photo) button{aspect-ratio:var(--photo-ratio,3/4)}
.puzzle-board button:disabled{opacity:1}.puzzle-board .empty{background:#fff;outline:1px dashed #729d8b;outline-offset:-5px}
.puzzle-board .photo,.piece-tray .photo{background-size:500% 500%;background-repeat:no-repeat}
.piece-tray button[aria-pressed=true]{outline:4px solid #286650;outline-offset:1px}
.puzzle-preview{display:block;width:min(100%,230px);height:auto;margin:10px auto;border-radius:10px}
.tiles .tile.progress{background:linear-gradient(180deg,#d0efd9 0 var(--done),#f8dee0 var(--done) var(--tried),#eff2f6 var(--tried) 100%)}

.top-arrows{display:flex;gap:4px;margin:0}.top-arrows button{padding:6px;min-width:44px;font-size:22px}
header{gap:4px}header>button{padding-inline:9px}
button.word-pass{color:#145232;background:#d0efd9;border-color:#307b51}
button.word-retry{color:#7b2533;background:#f8dee0;border-color:#a64955}
</style>
<main>
<header><button id="home">Übersicht</button><nav class="top-arrows" aria-label="Navigation"><button id="back" type="button" aria-label="Zurück" disabled>←</button><button id="forward" type="button" aria-label="Vor" disabled>→</button></nav><button id="parents">Für Eltern</button></header>
<article id="screen"></article>
</main>
<script>
'use strict';
const screens = {
 A:[
 ['Muster','Was kommt als Nächstes?','△ □ △ △ □ ?', ['○','□','△'],'△'],
 ['Zahlen','Wie viele bleiben übrig?','7 Punkte sind da. 3 kommen weg.', ['3','4','5','6'],'4'],
 ['Sortieren','Was passt am wenigsten dazu? Sag, warum.','', ['Tasse','Teller','Schüssel','Socke'],'Socke'],
 ['Reihenfolge','Was liegt in der Mitte?','Das Dreieck liegt vor dem Quadrat. Der Kreis liegt hinter dem Quadrat.', ['Dreieck','Quadrat','Kreis'],'Quadrat'],
 ['Weg im Raster','Starte beim Kreis. Zeig, wo du ankommst.','2 nach unten, 1 nach rechts.',null,'unten Mitte'],
 ['Merkfolge','Hör zu. Sag die Wörter in derselben Reihenfolge.','Jetzt liest dir jemand drei Wörter vor.',null,'Ball – Baum – Fisch']
 ],
 B:[
 ['Die Eierreihe','Welches Bild kommt als Nächstes?','',null,'🥚'],
 ['Der Futtervorrat','Wie viele Beeren sind noch da?','',null,'5'],
 ['Das falsche Nest','Welches Bild passt am wenigsten dazu?','',null,'👟'],
 ['Die Schlafplätze','Wer gehört in die Mitte?','',null,'🦕'],
 ['Der Weg zur Höhle','Starte beim Dino. Folge den Pfeilen und tippe auf das Zielfeld.','',null,'unten Mitte'],
 ['Dinos auf Besuch','Merk dir die Reihenfolge. Tippe danach die Bilder in derselben Reihenfolge an.','',null,'🐣 🐢 🦕']
 ]
};
const key='mats-denkcheck-v1';
const fresh=()=>({A:{i:0,a:{},notes:{},fun:''},B:{i:0,a:{},notes:{},fun:''}});
let data=fresh(), persistent=true;
try{const saved=localStorage.getItem(key);if(saved)data=JSON.parse(saved);}catch{persistent=false;}
if(data.B.edition!==2){
 data.B={i:0,a:{},notes:{},fun:'',edition:2};
}
data.groups ??=[];

const photoKey='mats-puzzle-photo-v1';
let defaultPhoto=null;
try{defaultPhoto=JSON.parse(localStorage.getItem(photoKey)||'null');}catch{}
let selectedPiece=null;
const puzzleAnimals=['🐣','🦕','🐢','🐰','🦖','🦊','🦉','🐿️','🐻'];
const puzzleColors=['#ffebbb','#ceeddd','#e4e1ff','#fadddf','#d0e8fc','#ffe5d1','#f4e0fa','#e1efbc','#d4eeee'];
function modeResults(group,mode){
 return mode==='merken'?group.results:group.byMode?.[mode]||{};
}
function pieceState(group){
 group.puzzle??={earned:[],placed:[]};
 const puzzle=group.puzzle;
 Object.keys(wordModes).forEach((mode,row)=>{
  const results=modeResults(group,mode);
  for(let col=0;col<5;col++){
   const index=row*5+col;
   const pair=group.words.slice(col*2,col*2+2);
   if(pair.every(word=>Object.hasOwn(results,word)&&results[word]==='solo')&&!puzzle.earned.includes(index)){
    puzzle.earned.push(index);
   }
  }
 });
 return puzzle;
}
function drawPiece(button,index,photo){
 if(photo){
  button.classList.add('photo');
  button.style.backgroundImage='url("'+photo.url+'")';
  button.style.backgroundPosition=(index%5*25)+'% '+(Math.floor(index/5)*25)+'%';
 }else{
  button.style.backgroundColor=puzzleColors[Math.floor(index/5)];
  button.textContent=(index+1)+' '+puzzleAnimals[index%puzzleAnimals.length];
 }
}
function puzzleList(){
 title('Meine Puzzles');
 if(!data.groups.length)el('p','Legt zuerst eine Lernwortgruppe an.');
 const list=el('div','',panel,'tiles');
 data.groups.forEach((group,i)=>{
  const puzzle=pieceState(group);
  const b=button('',()=>{groupIndex=i;selectedPiece=null;open('board');},list,'tile');
  el('span','🧩 Gruppe '+(i+1),b);
  el('small',puzzle.earned.length+' von 25 Teilen gesammelt',b);
 });
}
function puzzleView(){
 const group=data.groups[groupIndex];
 if(!group){open('puzzle');return;}
 title('Puzzle · Gruppe '+(groupIndex+1));
 const puzzle=pieceState(group);
 const photo=Object.hasOwn(group,'photo')?group.photo:defaultPhoto;
 const remaining=puzzle.earned.filter(i=>!puzzle.placed.includes(i)).sort((a,b)=>(a*13)%25-(b*13)%25);
 el('p',puzzle.earned.length+' von 25 Teilen gesammelt · '+puzzle.placed.length+' eingesetzt');
 const status=el('p',remaining.length?'Tippe ein Teil an und wähle dann einen Platz.':puzzle.placed.length===25?'Geschafft! Dein Puzzle ist fertig.':'Die Wörter 1 und 2, 3 und 4 und so weiter ergeben je ein Teil pro Übungsart.');
 status.setAttribute('role','status');
 if(photo){
  const hint=el('details','');
  el('summary','Puzzlebild als Hilfe zeigen',hint);
  const preview=el('img','',hint,'puzzle-preview');
  preview.src=photo.url;preview.alt='Vorschau des Puzzlebilds';
 }
 const board=el('div','',panel,'puzzle-board'+(photo?' photo-board':''));
 if(photo)board.style.setProperty('--photo-ratio',photo.ratio);
 for(let i=0;i<25;i++){
  const placed=puzzle.placed.includes(i);
  const slot=button(placed?'':(photo?'':String(i+1)),()=>{
   if(selectedPiece===null){status.textContent='Wähle zuerst ein Puzzleteil.';return;}
   if(selectedPiece!==i){status.textContent='Das Teil passt hier noch nicht. Probier einen anderen Platz.';return;}
   puzzle.placed.push(i);
   selectedPiece=null;save();open('board');
  },board,placed?'':'empty');
  slot.disabled=placed;
  slot.setAttribute('aria-label','Platz '+(i+1)+(placed?', eingesetzt':''));
  if(placed)drawPiece(slot,i,photo);
 }
 if(remaining.length){
  const tray=el('div','',panel,'piece-tray');
  if(photo)tray.style.setProperty('--photo-ratio',photo.ratio);
  remaining.forEach((i,n)=>{
   const piece=button('',()=>{
    selectedPiece=i;mark(tray,piece);status.textContent='Wähle jetzt einen freien Platz im Puzzle.';
   },tray);
   piece.setAttribute('aria-label','Puzzleteil '+(n+1)+' · '+Object.values(wordModes)[Math.floor(i/5)]);
   piece.setAttribute('aria-pressed',String(selectedPiece===i));
   drawPiece(piece,i,photo);
  });
 }
 const nav=el('nav','');
 if(puzzle.placed.length)button('Teile zurücklegen',()=>{
  puzzle.placed=[];selectedPiece=null;save();open('board');
 },nav);
 button('Zu meinen Puzzles',()=>open('puzzle'),nav);
}
function puzzlePhotoSettings(){
 title('Puzzlebild');
 if(!data.groups.length){el('p','Legt zuerst eine Lernwortgruppe an.');button('Zu den Lernwortgruppen',()=>open('groups'));return;}
 const select=el('select','',el('label','Wörtergruppe'));
 data.groups.forEach((group,i)=>{const option=el('option','Gruppe '+(i+1),select);option.value=i;});
 select.value=groupIndex;
 select.onchange=()=>{groupIndex=Number(select.value);open('photo');};
 const group=data.groups[groupIndex];
 const photo=Object.hasOwn(group,'photo')?group.photo:defaultPhoto;
 el('p','Wählt ein Foto von diesem Gerät. Es wird im Browser für diese Wörtergruppe gespeichert.');
 const input=el('input','',el('label','Foto auswählen'));
 input.type='file';input.accept='image/*';
 const status=el('p',photo?'Eigenes Foto ausgewählt.':'Das Tierpuzzle ist ausgewählt.');
 status.setAttribute('role','status');
 input.onchange=async()=>{
  const file=input.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  try{
   const image=new Image();
   image.src=url;await image.decode();
   const scale=Math.min(1,750/Math.max(image.width,image.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
   canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
   const next={url:canvas.toDataURL('image/jpeg',.83),ratio:canvas.width+'/'+canvas.height};
   group.photo=next;
   try{localStorage.setItem(key,JSON.stringify(data));}
   catch(error){group.photo=photo;throw error;}
   open('photo');
  }catch{status.textContent='Das Foto konnte nicht gespeichert werden. Probiert es mit einem JPG oder PNG.';}
  finally{URL.revokeObjectURL(url);}
 };
 if(photo)button('Tierpuzzle verwenden',()=>{
  group.photo=null;save();open('photo');
 });
 button('Zum Puzzle',()=>{selectedPiece=null;open('board');},el('nav',''),'primary');
}

const activities=[
 {label:'🦕 Denkcheck',hint:'Denkaufgaben und Dino-Mission',view:'check'},
 {label:'📚 Lernwörter',hint:'Wörter in Zehnergruppen üben',view:'words'},
 {label:'🧩 Mein Puzzle',hint:'Gesammelte Teile einsetzen',view:'puzzle'}
];
const wordModes={
 lesen:'Lesen', luecke:'Lückentext', stellen:'Schwierige Stellen', diktat:'Diktat', merken:'Anschauen und zudecken'
};
let groupIndex=0, wordIndex=0, wordShown=true, wordMode='lesen';
let exerciseWords=[];
function chooseWordMode(){
 const group=data.groups[groupIndex];
 title('Gruppe '+(groupIndex+1));
 const tiles=el('div','',panel,'tiles');
 const hints={lesen:'Wörter laut lesen',luecke:'Fehlendes Wort im Satz ergänzen',stellen:'Fehlende Buchstaben antippen',diktat:'Hören, schreiben und prüfen',merken:'Aus dem Kopf auf Papier schreiben'};
 for(const [id,label] of Object.entries(wordModes)){
  const available=group.words.filter(word=>id==='luecke'?group.cards?.find(c=>c.word===word)?.sentence:id==='stellen'?maskFor(group,word):true);
  const tile=button('',()=>{wordMode=id;exerciseWords=available;wordIndex=0;wordShown=true;open('practice');},tiles,'tile');
  el('span',label,tile);el('small',available.length?hints[id]:id==='luecke'?'Erst einen Lückensatz im Elternbereich eintragen':'Erst eine schwierige Stelle eintragen',tile);
  const results=modeResults(group,id);
  const states=available.map(word=>Object.hasOwn(results,word)?results[word]:'');
  const done=states.filter(result=>result==='solo').length;
  const tried=states.filter(Boolean).length;
  if(available.length){
   tile.classList.add('progress');
   tile.style.setProperty('--done',done/available.length*100+'%');
   tile.style.setProperty('--tried',tried/available.length*100+'%');
   el('small',done+' / '+available.length+' selbst geschafft',tile);
  }
  tile.disabled=!available.length;
 }
 el('small','Grün: selbst geschafft · Rosa: noch mal üben · Grau: offen');
 el('small','Für alle fünf Lückentext-Teile braucht jedes der zehn Wörter einen Lückensatz.');
 const nav=el('nav','');
 button('Zu den Gruppen',()=>open('words'),nav);
 button('Puzzle dieser Gruppe',()=>{selectedPiece=null;open('board');},nav);
}
function normalizeMask(mask){
 return mask.includes('_')?mask:mask.replace(/x+/g,part=>'_'.repeat(part.length));
}
function maskFor(group,word){
 const mask=group.cards?.find(c=>c.word===word)?.mask;
 if(mask)return normalizeMask(mask);
 const letters=Array.from(word);
 const tricky=word.match(/tsch|sch|chs|ck|tz|ß|ie|(?:[aeou])h|([bdfgklmnprstz])\1/iu)||word.match(/[äöü](?:u)?|[dtgbp]$/iu);
 if(tricky){
  const start=Array.from(word.slice(0,tricky.index)).length;
  const length=Array.from(tricky[0]).length;
  return letters.map((letter,i)=>i>=start&&i<start+length?'_':letter).join('');
 }
 const vowel=letters.findIndex((letter,i)=>i>0&&/[aeiou]/i.test(letter));
 const target=vowel>=0?vowel:Math.floor(letters.length/2);
 return letters.map((letter,i)=>i===target?'_':letter).join('');
}
function markWord(group,word,result){
 const before=pieceState(group).earned.length;
 if(wordMode==='merken'){
  Object.defineProperty(group.results,word,{value:result,enumerable:true,writable:true,configurable:true});
 }else{
  group.byMode??={};
  group.byMode[wordMode]??={};
  Object.defineProperty(group.byMode[wordMode],word,{value:result,enumerable:true,writable:true,configurable:true});
 }
 const earned=pieceState(group).earned.length>before;
 save();
 return earned;
}
function wordFeedback(group,word){
 const row=el('div','',panel,'row');
 for(const [value,label] of [['solo','✓ Geschafft'],['repeat','↻ Noch mal üben']]){
  button(label,()=>{const earned=markWord(group,word,value);nextWord(earned);},row,value==='solo'?'word-pass':'word-retry');
 }
}
function clozeExercise(group,word,sentence){
 el('p',sentence,panel,'cloze');
 el('p','Tippe auf das fehlende Wort.');
 const alternatives=group.words.filter(candidate=>candidate!==word);
 const pick=()=>alternatives.splice(Math.floor(Math.random()*alternatives.length),1)[0];
 const choices=[pick(),pick()];
 choices.splice(Math.floor(Math.random()*3),0,word);
 const row=el('div','',panel,'row');
 for(const choice of choices){
  button(choice,()=>{
   const correct=choice===word;
   const earned=markWord(group,word,correct?'solo':'repeat');
   for(const option of row.querySelectorAll('button')){
    option.disabled=true;
    if(option.textContent===word)option.classList.add('word-pass');
    else if(option.textContent===choice)option.classList.add('word-retry');
   }
   const feedback=correct?(earned?'Richtig! 🧩 Ein Puzzleteil für dich.':'Richtig!'):'Hier passt: '+word+'.';
   el('p',feedback,panel,'result').setAttribute('role','status');
   button('Weiter',nextWord,panel,'primary').focus();
  },row);
 }
}
function textExercise(group,word,prompt){
 const form=el('form','');
 const field=el('input','',el('label',prompt,form),'answer-input');
 field.type='text';field.autocapitalize='off';field.autocomplete='off';field.spellcheck=false;field.setAttribute('autocorrect','off');
 const submit=el('button','Prüfen',form,'primary');
 submit.type='submit';
 form.onsubmit=(event)=>{
  event.preventDefault();
  const answer=field.value.trim().normalize('NFC');
  if(!answer||submit.disabled)return;
  field.disabled=true;submit.disabled=true;
  const correct=answer===word;
  const earned=markWord(group,word,correct?'solo':'repeat');
  el('p',correct?(earned?'Richtig! 🧩 Ein Puzzleteil für dich.':'Richtig!'):'So wird das Wort geschrieben: '+word,form,'result').setAttribute('role','status');
  button('Weiter',nextWord,form,'primary').focus();
 };
}
function letterExercise(group,word,mask){
 // The entered mask has the same prefix and suffix as the word.
 const [,prefix,gap,suffix]=mask.match(/^(.*?)(_+)(.*)$/);
 const answer=Array.from(word).slice(Array.from(prefix).length,Array.from(prefix+gap).length);
 const display=el('p',mask,panel,'word');
 display.setAttribute('aria-live','polite');
 const letters=el('div','',panel,'letters');
 const picked=[];
 const choices=[...new Set([...answer,'s','k','z','t'])].sort((a,b)=>a.localeCompare(b,'de'));
 const draw=()=>{display.textContent=prefix+picked.join('')+'_'.repeat(answer.length-picked.length)+suffix;};
 choices.forEach(letter=>button(letter,()=>{if(picked.length<answer.length){picked.push(letter);draw();}},letters));
 const controls=el('div','',panel,'row');
 button('Letzten Buchstaben löschen',()=>{picked.pop();draw();},controls);
 const check=button('Prüfen',()=>{
  if(picked.length!==answer.length)return;
  const correct=picked.join('')===answer.join('');
  check.disabled=true;
  [...letters.querySelectorAll('button'),...controls.querySelectorAll('button')].forEach(b=>b.disabled=true);
  const earned=markWord(group,word,correct?'solo':'repeat');
  el('p',correct?(earned?'Richtig! 🧩 Ein Puzzleteil für dich.':'Richtig!'):'So wird das Wort geschrieben: '+word,panel,'result').setAttribute('role','status');
  button('Weiter',nextWord,panel,'primary').focus();
 },controls,'primary');
}
function dictation(word){
 el('p','Hör genau hin und schreib das Wort.');
 if('speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function'){
  button('🔊 Wort anhören',()=>{
   const voice=new SpeechSynthesisUtterance(word);
   voice.lang='de-DE';voice.rate=.8;
   window.speechSynthesis.cancel();window.speechSynthesis.speak(voice);
  });
 }
 const manual=el('details','');
 el('summary','Wort für Vorlesende zeigen',manual);
 el('p',word,manual);
}

function wordsView(){
 title('Lernwörter');
 if(!data.groups.length)el('p','Legt zuerst im Elternbereich eine Gruppe mit zehn Wörtern an.');
 const list=el('div','',panel,'tiles');
 data.groups.forEach((group,i)=>{
  const b=button('',()=>{groupIndex=i;open('wordModes');},list,'tile');
  el('span','Gruppe '+(i+1),b);
  el('small',new Set([...Object.keys(group.results),...Object.values(group.byMode||{}).flatMap(Object.keys)]).size+' von 10 schon geübt',b);
 });
 button('Gruppen verwalten',()=>open('groups'));
}
function groupEditor(){

function groupForm(parent,index){
 const area=el('textarea','',el('label','Zehn Lernwörter',parent));
 area.rows=10;
 if(index!==null)area.value=data.groups[index].words.map(word=>{
  const card=data.groups[index].cards?.find(c=>c.word===word);
  return card&&(card.sentence||card.mask)?[word,card.sentence,normalizeMask(card.mask||'')].join(' | '):word;
 }).join('\n');
 const error=el('p','',parent);
 error.className='form-error';
 error.setAttribute('role','status');
 button('Gruppe speichern',()=>{
  try{
   const cards=parseCards(area.value);
   if(index===null)data.groups.push(makeGroup(cards));
   else data.groups[index]=makeGroup(cards,data.groups[index]);
  }catch(problem){error.textContent=problem.message;return;}
  save();open('groups');
 },parent,'primary');
}
function parseCards(text){
  const rows=text.split(/\r?\n/).map(line=>line.trim().normalize('NFC')).filter(Boolean);
  const parts=rows.map(line=>line.split('|').map(field=>field.trim()));
  const cards=parts.map(([word,sentence='',mask=''])=>({word,sentence,mask:normalizeMask(mask)}));
  const words=cards.map(card=>card.word);
  if(words.length!==10||new Set(words.map(w=>w.toLocaleLowerCase('de'))).size!==10||words.some(w=>!w||/\s/.test(w))||parts.some(p=>p.length>3)){
   throw new Error('Bitte genau zehn verschiedene Wörter eingeben, eines pro Zeile.');
  }
  for(const {word,sentence,mask} of cards){
   if(sentence&&(sentence.match(/_+/g)||[]).join(' ')!=='___'){
    throw new Error('Der Satz für „'+word+'“ braucht genau eine Lücke mit drei Unterstrichen (___).');
   }
   if(mask){
    const valid=Array.from(mask).length===Array.from(word).length&&[...mask.matchAll(/_+/g)].length===1&&Array.from(mask).every((letter,i)=>letter==='_'||letter===Array.from(word)[i]);
    if(!valid){
     throw new Error('Bei „'+word+'“ muss die schwierige Stelle aus zusammenhängenden Unterstrichen bestehen, eines je Buchstabe.');
    }
   }
  }
 return cards;
}
function makeGroup(cards,previous){
 const words=cards.map(card=>card.word);
 const keep=results=>Object.fromEntries(words.filter(w=>Object.hasOwn(results,w)).map(w=>[w,results[w]]));
 const samePairs=previous?.words.every((word,i)=>word===words[i]);
 return {words,cards,results:keep(previous?.results||{}),
  byMode:Object.fromEntries(Object.entries(previous?.byMode||{}).map(([mode,results])=>[mode,keep(results)])),
  puzzle:samePairs?previous.puzzle:undefined,
  ...(previous&&Object.hasOwn(previous,'photo')?{photo:previous.photo}:{})};
}
function configuration(){
 title('Wortgruppen auf anderen Geräten');
 el('p','Exportiert hier die Wortgruppen als JSON. Legt den Text auf GitHub in denkcheck/lernwoerter.json ab. Auf weiteren Geräten könnt ihr ihn hier laden.');
 el('small','Die Gruppen im GitHub-Repo sind öffentlich. Der Export enthält nur Wörter, Sätze und Buchstabenlücken.');
 const output=el('textarea','',el('label','Konfiguration'));
 output.value=JSON.stringify({version:1,groups:data.groups.map(group=>group.words.map(word=>{
  const card=group.cards?.find(c=>c.word===word);
  return card&&(card.sentence||card.mask)?[word,card.sentence,card.mask].join(' | '):word;
 }))},null,2);
 const status=el('p','');
 status.setAttribute('role','status');
 function applyConfig(value){
  if(value?.version!==1||!Array.isArray(value.groups))throw new Error('Das Dateiformat ist ungültig.');
  const parsed=value.groups.map(rows=>{
   if(!Array.isArray(rows)||rows.some(row=>typeof row!=='string'))throw new Error('Jede Gruppe braucht zehn Wortzeilen.');
   return parseCards(rows.join('\n'));
  });
  let added=0;
  for(const cards of parsed){
   const i=data.groups.findIndex(group=>group.words.every((word,index)=>word===cards[index].word));
   if(i<0){data.groups.push(makeGroup(cards));added++;}
   else data.groups[i]=makeGroup(cards,data.groups[i]);
  }
  save();
  status.textContent=parsed.length+' Gruppen geladen · '+added+' neu.';
 }
 button('JSON übernehmen',()=>{
  try{applyConfig(JSON.parse(output.value));}catch(problem){status.textContent=problem.message;}
 });
 button('Von GitHub laden',async(event)=>{
  event.currentTarget.disabled=true;
  try{
   const response=await fetch('./lernwoerter.json',{cache:'no-store'});
   if(!response.ok)throw new Error('Auf GitHub ist noch keine lernwoerter.json verfügbar.');
   const config=await response.json();
   applyConfig(config);
   output.value=JSON.stringify(config,null,2);
  }catch(problem){status.textContent=problem.message;}
  finally{event.currentTarget.disabled=false;}
 });
 button('Zu den Lernwortgruppen',()=>open('groups'),el('nav',''));
}
let stopReading=()=>{};
function readingMic(word){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Recognition){el('small','Mikrofon-Erkennung ist hier nicht verfügbar. Ihr könnt das Lesen unten bestätigen.');return;}
 el('small','Die Spracherkennung des Browsers kann Ton zur Verarbeitung an einen Dienst senden. Die App speichert keine Aufnahme.');
 const status=el('p','');
 status.setAttribute('role','status');
 const start=button('🎙 Vorlesen starten',()=>{
  let recognition;
  try{
   recognition=new Recognition();
   recognition.lang='de-DE';
   recognition.maxAlternatives=1;
   stopReading=()=>{recognition.onend=null;recognition.onresult=null;recognition.onerror=null;recognition.abort();};
   recognition.onresult=event=>{
    const heard=event.results[0][0].transcript.trim().replace(/[.!?]+$/,'');
    const matches=heard.toLocaleLowerCase('de')===word.toLocaleLowerCase('de');
    status.textContent='Verstanden: „'+heard+'“. '+(matches?'Das klingt passend.':'Bitte hört selbst hin und bestätigt unten.');
   };
   recognition.onerror=()=>{status.textContent='Das Mikrofon konnte das Wort nicht erkennen. Ihr könnt unten selbst bestätigen.';};
   recognition.onend=()=>{start.disabled=false;stopReading=()=>{};};
   recognition.start();start.disabled=true;status.textContent='Ich höre zu …';
  }catch{stopReading=()=>{};status.textContent='Mikrofon nicht verfügbar. Ihr könnt unten selbst bestätigen.';}
 });
}

function open(next){
 const page={view:next,form,groupIndex,wordIndex,wordMode,wordShown,exerciseWords,memoryOpen,roundIndex:data[form].i};
 const current=navigation[navigationIndex];
 if(!current||Object.keys(page).some(key=>page[key]!==current[key])){
  navigation.splice(navigationIndex+1);
  navigation.push(page);
  navigationIndex=navigation.length-1;
 }
 showPage(next);
}

 render();

 forwardButton.disabled=navigationIndex>=navigation.length-1;
 panel.querySelector('h1')?.focus();
 window.scrollTo(0,0);
}

 if(!page)return;

 if(page.view==='round')data[form].i=page.roundIndex;

function dinoPuzzle(i,round){
 switch(i){
  case 0:
   strip(['🥚','🐣','🐣','🥚','🐣','🐣','?']);
   pictureChoices(['🐣','🥚','🦕'],i,round);
   break;
  case 1:
   strip(Array(8).fill('🫐'),3);
   pictureChoices(['4','5','6','7'],i,round);
   break;
  case 2:
   pictureChoices(['🦕','👟','🦖','🐢'],i,round);
   break;
  case 3:
   strip(['🦖','→','🦕']);
   strip(['🦕','→','🐢']);
   strip(['🦖','?','🐢']);
   pictureChoices(['🐢','🦕','🦖'],i,round);
   break;
  case 4:
   strip(['⬇','⬇','⬅']);
   pictureChoices(locations,i,round,'grid');
   break;
  case 5:
   if(!memoryOpen&&!round.a[i]){
    strip(['🐣','🐢','🦕']);
    button('Bilder zudecken',()=>{memoryOpen=true;render();panel.querySelector('.memory-picked').focus();},panel,'primary');
    break;
   }
   const selection=el('p',round.a[i]||'Noch kein Bild gewählt',panel,'symbols memory-picked');
   selection.tabIndex=-1;
   selection.setAttribute('aria-live','polite');
   const group=el('div','',panel,'row choices picture-choices');
   const update=()=>{
    const picked=(round.a[i]||'').split(' ').filter(Boolean);
    selection.textContent=picked.join(' ')||'Noch kein Bild gewählt';
    group.querySelectorAll('button').forEach(b=>{
     b.setAttribute('aria-pressed',String(picked.includes(b.textContent)));
    });
   };
   for(const picture of ['🦕','🐣','🐢']){
    const b=button(picture,()=>{
     const picked=(round.a[i]||'').split(' ').filter(Boolean);
     if(picked.includes(picture)||picked.length===3)return;
     round.a[i]=[...picked,picture].join(' ');
     save();update();
    },group);
    b.setAttribute('aria-label',pictureNames[picture]);
   }
   button('Auswahl leeren',()=>{delete round.a[i];save();update();});
   update();
   break;
 }
}

   const r=data[f];
   lines.push(mode[f]);
   screens[f].forEach(([name],i)=>lines.push((i+1)+'. '+name+' – '+(r.notes[i]||'ohne Beobachtung')+(r.a[i]?' · getippt: '+r.a[i]:'')));
   lines.push('Lieblingsrätsel: '+(r.fun||'offen'),'');
  }
  lines.push('Beobachtungen: '+(data.comment||''));
  return lines.join('\n');
 };
 let report;
 for(const f of ['A','B']){
  const r=data[f], field=el('fieldset','');
  el('legend',mode[f],field);
  screens[f].forEach(([name,,,,answer],i)=>{
   const label=el('label',(i+1)+'. '+name,field);
   el('small','Lösung: '+answer+(r.a[i]?' · Gewählte Antwort: '+r.a[i]:''),label);
   const select=el('select','',label);
   for(const state of ['','Selbst gelöst','Nach Hilfe','Offen oder übersprungen']){
    const opt=el('option',state||'Beobachtung wählen',select);opt.value=state;
   }
   select.value=r.notes[i]||'';
   select.onchange=()=>{r.notes[i]=select.value;save();report.value=summary();};
  });
 }
 const comment=el('textarea','',el('label','Was hat geholfen? Wie wurde das Rätsel gelöst?'));
 comment.value=data.comment||'';
 comment.oninput=()=>{data.comment=comment.value;save();report.value=summary();};
 report=el('textarea','',el('label','Zusammenfassung fürs Training'),'report');
 report.readOnly=true;
 report.value=summary();
 button('Zusammenfassung markieren',()=>{report.focus();report.select();report.setSelectionRange(0,report.value.length);});
 button('Zum Denkcheck',()=>open('check'),el('nav',''),'primary');
}
open('home');
</script>
</html>
